<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apply for Loan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="login.html">Cooperative App</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="login.html">Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contribution.html">Contributions</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="loan.html">Loans</a>
        </li>
      </ul>
    </div>
  </div>
</nav>


  <h2 class="text-center">Apply for Loan</h2>
  <form id="loanForm">
  <div class="mb-3">
    <label for="loanAmount" class="form-label">Loan Amount</label>
    <input type="number" id="loanAmount" class="form-control" required>
  </div>

  <div class="mb-3">
    <label for="durationMonths" class="form-label">Duration (months)</label>
    <input type="number" id="durationMonths" class="form-control" required>
  </div>

  <div class="mb-3">
    <label for="loanType" class="form-label">Loan Type</label>
    <select id="loanType" class="form-select" required>
      <option value="Normal">Normal Loan</option>
      <option value="Emergency">Emergency Loan</option>
      <option value="Commodity">Commodity/Electronics Loan</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary">Apply Loan</button>
</form>


  <h3>Loan History</h3>
<ul id="loanList"></ul>

<h3>Repayment Schedule</h3>
<ul id="repaymentList"></ul>

  <script src="js/main.js"></script>
</body>
</html>
