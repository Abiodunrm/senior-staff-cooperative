<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apply for Loan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
  <h2 class="text-center">Apply for Loan</h2>
  <form id="loanForm" class="mt-4">
  <div class="mb-3">
    <label class="form-label">Loan Amount</label>
    <input type="number" id="loanAmount" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Duration (months)</label>
    <input type="number" id="durationMonths" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-primary w-100">Apply</button>
</form>

  <h3>Loan History</h3>
<ul id="loanList"></ul>

<h3>Repayment Schedule</h3>
<ul id="repaymentList"></ul>

  <script src="js/main.js"></script>
</body>
</html>
