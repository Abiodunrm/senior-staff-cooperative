<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contributions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
  <h2 class="text-center">Add Contribution</h2>
  <form id="contributionForm" class="mt-4">
    <div class="mb-3">
      <label class="form-label">Contribution Amount</label>
      <input type="number" id="contributionAmount" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success w-100">Add Contribution</button>
  </form>

  <h3 class="mt-5">My Contributions</h3>
  <ul id="contributionList" class="list-group"></ul>

  <script src="js/main.js"></script>
</body>
</html>
