<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contributions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="login.html">Cooperative App</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="login.html">Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contribution.html">Contributions</a>
        </li>
        
        <li class="nav-item">
          <a class="nav-link" href="loan.html">Loans</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

  <div class="container mt-4">
  <h2>Contribution Management</h2>

  <!-- Admin-only form -->
  <div id="adminContributionForm">
    <form id="contributionForm">
      <div class="mb-3">
        <label for="memberSelect" class="form-label">Select Member</label>
        <select id="memberSelect" class="form-select" required></select>
      </div>
      <div class="mb-3">
        <label for="contributionAmount" class="form-label">Contribution Amount</label>
        <input type="number" id="contributionAmount" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Add Contribution</button>
    </form>
  </div>

  <!-- Contribution history (shared for admin & members) -->
  <h3 class="mt-4">Contribution History</h3>
  <ul id="contributionList" class="list-group"></ul>
  <p id="totalContribution" class="mt-3 fw-bold"></p>
</div>


  <script src="js/main.js"></script>
</body>
</html>
